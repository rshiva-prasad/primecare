# Not in pyproject.toml: see the note in ruff.toml.
[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=app --cov-report=term-missing --cov-fail-under=80
# Starlette suggests httpx2 for TestClient; httpx is the pinned dev dependency.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
